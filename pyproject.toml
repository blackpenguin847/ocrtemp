[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "estimate-ocr"
version = "0.1.0"
description = "스캔된 견적 원가명세서 PDF를 로컬 Ollama vision 모델로 구조화 데이터(JSON/CSV/XLSX)로 변환하는 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyMuPDF>=1.23",
    "Pillow>=10.0",
    "requests>=2.28",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Tesseract 보조 경로. 시스템 패키지도 필요하다:
#   apt install tesseract-ocr tesseract-ocr-kor   /   brew install tesseract tesseract-lang
tesseract = ["pytesseract>=0.3.10"]
dev = ["pytest>=7.0", "pytesseract>=0.3.10"]

[project.scripts]
estimate-ocr = "estimate_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
